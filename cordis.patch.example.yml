# 发布用示例：把这一条插进你的 profile `cordis.patch.yml`（那是个 YAML 数组），
# 或者把本插件当 bundle 装进 profile 后直接改 profile 自己那份 patch。
#
# 唯一的必填项是 `root`（或者设环境变量 `DSH_MEMORY_ROOT`）；
# 档案根的特征文件是 `身份.md` + `日记.md` + `生长\状态.md`，三者齐备才认。
- insert:
    - id: auto-handoff
      name: dsh-auto-handoff
      config:
        # ── 档案在哪 ──────────────────────────────────────────────
        # 留空则依次尝试：DSH_MEMORY_ROOT → ~/.dsh/memory → 从 cwd 向上找特征文件。
        root: ''

        # ── 什么时候触发 ─────────────────────────────────────────
        # 上下文占用到 65% 触发；会话至少 3 轮；冷却 3 分钟（过了冷却还能再交一次）。
        triggerRatio: 0.65
        minTurns: 3
        cooldownMs: 180000

        # ── 写什么 ───────────────────────────────────────────────
        # 交接包上限：**只有它进新会话**，所以必须限长，不要粘全文。
        handoffMaxChars: 1200
        # 这台设备在日记标题与状态节里的标签，例如 '【PC】' / '【V40】'。
        device: '【PC】'

        # ── 安全开关 ─────────────────────────────────────────────
        # 首次建议保持 true：只把"本来会写什么"记进日志，一个字节都不写。
        dryRun: true

        # ── 换会话交给谁 ─────────────────────────────────────────
        # 本插件**不自己建会话**：它 POST 到这个地址请 dsh-session-switch 接手；
        # 叫不动就降级，把完整待接写到 ~/.dsh/session-switch/pending.json，
        # 由浏览器那半边（client.js）自己切。
        gatewayBase: http://127.0.0.1:3080

        # ── 手动演练 ─────────────────────────────────────────────
        # 在对话里整句打出这个关键词 → 只写演练副本（sandboxRoot），真档案一字不碰。
        drillKeyword: '#交接演练'

        # ── 设备判据（可选）──────────────────────────────────────
        # 只对"旧条目没写设备标签"的情况有意义：早于 legacyBoundary 的算 legacyDevice。
        # **没配就完全不推断** —— 别把别人档案的归属规则套到自己身上。
        legacyDevice: ''
        legacyBoundary: ''
